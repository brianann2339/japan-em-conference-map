name: 追蹤日本急診相關醫學會議

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "data/conferences.json"
      - "data/watchlist.json"
      - "data/submission_deadlines.json"
      - "data/history_sources/**"
      - "data/additions/**"
      - "render.py"
      - "build.py"
      - "assets/**"
      - "scripts/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/track.yml"

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: japan-em-conference-tracker
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安裝套件
        run: pip install -r requirements.txt

      - name: 偵測官方來源變動
        if: github.event_name != 'push'
        id: monitor
        run: python scripts/monitor_sources.py --check

      - name: 執行測試
        run: python -m unittest discover -s tests -v

      - name: 重新產生網站
        run: python build.py

      - name: 提交監測與網站更新
        run: |
          git config user.name "conference-tracker[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs dist
          for file in data/source-health.json CHANGELOG.md CHANGES.md; do
            if [ -e "$file" ]; then git add "$file"; fi
          done
          if git diff --staged --quiet; then
            echo "沒有檔案變動，略過 commit"
          else
            git commit -m "更新會議來源監測（$(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M JST')）"
            git push
          fi

      - name: 來源變動或讀取失敗時開 issue
        if: github.event_name != 'push' && (steps.monitor.outputs.changed == 'true' || steps.monitor.outputs.failed == 'true')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "官方來源需複核（$(TZ=Asia/Tokyo date '+%Y-%m-%d')）" \
            --body-file CHANGES.md

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: track
    steps:
      - name: 部署 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
